<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>종교개혁지 순례 19단계</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;background:#f8f6f1;color:#172033}header{background:#14213b;color:white;padding:17px}h1{font-size:21px;margin:0 0 8px}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:9px 12px}nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}nav button{background:#334155;color:white}.selected{background:#f59e0b!important;color:#111827!important}.layout{display:grid;grid-template-columns:390px 1fr;height:calc(100vh - 155px)}aside{overflow:auto;padding:12px}.stop{background:white;border:1px solid #ddd;border-radius:12px;margin-bottom:8px;padding:12px;cursor:pointer}.stop:hover,.stop.active{border-color:#d97706;background:#fffbeb}.stop b{display:block;margin-bottom:5px}.small{font-size:12px;color:#64748b}.detail{font-size:13px;line-height:1.6}#map{height:100%;min-height:450px}.photos{display:none;padding:20px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:15px}.photo{background:white;border-radius:14px;overflow:hidden;border:1px solid #ddd}.photo img{width:100%;height:165px;object-fit:cover;background:#e2e8f0}.photo section{padding:14px}.photo h3{margin:0 0 7px}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}input{padding:9px;border-radius:8px;border:1px solid #aaa;max-width:270px}#info{background:#fffbeb;padding:9px 15px;font-size:13px}a{color:#92400e}@media(max-width:800px){.layout{display:flex;flex-direction:column;height:auto}aside{max-height:340px}#map{height:520px}.photos{padding:10px}}@media print{header,nav,#info,.layout{display:none!important}.photos{display:grid!important;grid-template-columns:1fr 1fr}.photo{break-inside:avoid}}</style></head><body><header><h1>✝ 종교개혁지 순례 여정 · 5개국 19단계</h1><div class="small" style="color:#cbd5e1">인천 ✈ 프랑크푸르트 → 독일 루터 루트 → 체코 후스 루트 → 오스트리아 → 스위스 개혁교회 → 스트라스부르 → 프랑크푸르트 ✈ 인천</div><nav><button id="mapTab" class="selected">🗺 지도와 동선</button><button id="photoTab">📷 현장사진 일정표</button><button id="europe">유럽 전체</button><button id="world">항공 전체</button><button id="play">▶ 경로 재생</button><button onclick="window.print()">🖨 인쇄 / PDF 저장</button></nav><div class="controls" style="margin-top:10px"><select id="theme"><option value="ALL">전체 방문지</option><option value="LUTHER">독일 루터</option><option value="HUS">체코 후스</option><option value="ALPINE">알프스</option><option value="REFORMED">개혁교회</option><option value="FLIGHT">항공</option></select><input id="search" placeholder="도시·유적·인물 검색"></div></header><div id="info">방문지를 선택하면 역사 해설과 이동 구간을 확인할 수 있습니다.</div><main class="layout" id="layout"><aside id="list"></aside><div id="map"></div></main><div class="photos" id="photos"></div><script>
const raw=[
['인천국제공항 출발','대한민국',37.4602,126.4407,'FLIGHT','인천국제공항','종교개혁의 발자취를 찾아 떠나는 순례 출발점'],
['프랑크푸르트 도착','독일',50.1109,8.6821,'FLIGHT','뢰머 광장·마인강변','유럽 육상 순례를 시작하는 관문'],
['하이델베르크','독일',49.3988,8.6724,'LUTHER','하이델베르크 성·성령교회','1518년 루터의 하이델베르크 논쟁과 1563년 하이델베르크 교리문답의 도시'],
['보름스','독일',49.6322,8.3472,'LUTHER','루터 기념비·제국의회 터','1521년 루터가 제국의회에서 자신의 신앙과 저술을 변호한 곳'],
['아이제나흐','독일',50.9816,10.3161,'LUTHER','바르트부르크 성·루터의 방','루터가 은신하며 신약성경을 독일어로 번역한 장소'],
['에르푸르트','독일',50.9848,11.0299,'LUTHER','아우구스티누스 수도원·대성당','루터가 수도사 생활을 시작하고 사제 서품을 받은 도시'],
['비텐베르크','독일',51.8667,12.6497,'LUTHER','성교회·루터 하우스·시교회','1517년 95개조 논제로 상징되는 종교개혁의 중심지'],
['드레스덴','독일',51.0504,13.7373,'LUTHER','프라우엔교회·루터 동상','루터교 전통과 전쟁 이후 복원의 역사를 만나는 도시'],
['프라하','체코',50.0755,14.4378,'HUS','얀 후스 기념비·베들레헴 예배당','얀 후스의 설교와 보헤미아 종교개혁의 중심지'],
['타보르','체코',49.4144,14.6578,'HUS','지슈카 광장·후스파 박물관','후스파 공동체가 형성한 역사적 도시'],
['잘츠부르크','오스트리아',47.8095,13.055,'ALPINE','호엔잘츠부르크 성·구시가지','1731년 개신교도 추방의 역사를 기억하는 곳'],
['인스부르크','오스트리아',47.2692,11.4041,'ALPINE','황금 지붕·노르트케테','알프스를 넘어 스위스로 향하는 경유지'],
['취리히','스위스',47.3769,8.5417,'REFORMED','그로스뮌스터·츠빙글리 기념상','츠빙글리의 설교에서 출발한 스위스 종교개혁의 중심'],
['인터라켄','스위스',46.6863,7.8632,'ALPINE','회에마테 공원·융프라우 조망','알프스의 자연을 감상하는 순례 경유지'],
['제네바','스위스',46.2044,6.1432,'REFORMED','종교개혁 기념벽·생 피에르 대성당','칼뱅의 목회와 제네바 아카데미로 알려진 개혁교회 중심지'],
['바젤','스위스',47.5596,7.5886,'REFORMED','바젤 대성당·에라스뮈스 묘소','1536년 칼뱅의 기독교 강요 초판이 출판된 도시'],
['스트라스부르','프랑스',48.5734,7.7521,'REFORMED','성 토마스 교회·노트르담 대성당','마르틴 부처의 사역과 칼뱅의 망명 목회가 이루어진 곳'],
['프랑크푸르트 귀환','독일',50.0379,8.5622,'FLIGHT','프랑크푸르트 국제공항','육상 순례를 마치고 귀국 항공편에 탑승'],
['인천국제공항 도착','대한민국',37.4602,126.4407,'FLIGHT','인천국제공항 입국장','종교개혁지 순례 종료']];
const colors={FLIGHT:'#4338ca',LUTHER:'#d97706',HUS:'#e11d48',ALPINE:'#0284c7',REFORMED:'#059669'};
const stops=raw.map((r,i)=>({n:i+1,name:r[0],country:r[1],lat:r[2],lng:r[3],theme:r[4],landmarks:r[5],desc:r[6]}));
const map=L.map('map').setView([49.5,10.3],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);const markers=[];
for(let i=0;i<stops.length-1;i++){let a=stops[i],b=stops[i+1];L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:i===0||i===17?'#4338ca':'#d97706',weight:3,dashArray:i===0||i===17?'7 7':null}).addTo(map)}
stops.forEach(s=>{if(s.n===19)return;let m=L.circleMarker([s.lat,s.lng],{radius:10,color:'white',weight:2,fillColor:colors[s.theme],fillOpacity:1}).addTo(map).bindTooltip(`${s.n}. ${s.name}`);m.on('click',()=>select(s.n));markers.push(m)});
function imgurl(s){return 'https://commons.wikimedia.org/w/index.php?search='+encodeURIComponent(s.landmarks.split('·')[0]+' '+s.name)+'&title=Special:MediaSearch&type=image'}
function filter(){let q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('theme').value;return stops.filter(s=>(t==='ALL'||s.theme===t)&&[s.name,s.country,s.landmarks,s.desc].join(' ').toLowerCase().includes(q))}
function select(n){let s=stops[n-1];document.getElementById('info').textContent=`${n}/19 · ${s.name} | ${s.landmarks} | ${s.desc}`;map.flyTo([s.lat,s.lng],n===1||n===19?5:8);document.querySelectorAll('.stop').forEach(e=>e.classList.toggle('active',+e.dataset.n===n));}
function render(){let f=filter();document.getElementById('list').innerHTML=f.map(s=>`<div class="stop" data-n="${s.n}"><b><span style="color:${colors[s.theme]}">●</span> ${s.n}. ${s.name}</b><div class="small">${s.country} · ${s.landmarks}</div><div class="detail">${s.desc}</div><div class="small">다음: ${stops[s.n]?.name||'순례 종료'}</div></div>`).join('');document.querySelectorAll('.stop').forEach(e=>e.onclick=()=>select(+e.dataset.n));document.getElementById('photos').innerHTML=f.map(s=>`<article class="photo"><div style="height:165px;background:linear-gradient(120deg,#14213b,${colors[s.theme]});display:grid;place-content:center;color:white;text-align:center"><div style="font-size:35px">✝</div><b>${s.name}</b><small>${s.country}</small></div><section><h3>${s.n}. ${s.name}</h3><p><b>핵심 유적:</b> ${s.landmarks}</p><p>${s.desc}</p><p class="small">다음 방문지: ${stops[s.n]?.name||'순례 종료'}</p><a href="${imgurl(s)}" target="_blank" rel="noopener">📷 위키미디어 실제 현장사진 찾아보기</a></section></article>`).join('')}
document.getElementById('theme').onchange=render;document.getElementById('search').oninput=render;document.getElementById('mapTab').onclick=()=>tab(false);document.getElementById('photoTab').onclick=()=>tab(true);function tab(photo){document.getElementById('layout').style.display=photo?'none':'';document.getElementById('photos').style.display=photo?'grid':'none';document.getElementById('mapTab').classList.toggle('selected',!photo);document.getElementById('photoTab').classList.toggle('selected',photo);if(!photo)setTimeout(()=>map.invalidateSize(),100)}document.getElementById('europe').onclick=()=>map.fitBounds(stops.slice(1,18).map(s=>[s.lat,s.lng]),{padding:[35,35]});document.getElementById('world').onclick=()=>map.fitBounds(stops.map(s=>[s.lat,s.lng]),{padding:[30,30]});let timer=null,idx=0;document.getElementById('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;document.getElementById('play').textContent='▶ 경로 재생';return}tab(false);idx=0;select(1);document.getElementById('play').textContent='⏸ 재생 중지';timer=setInterval(()=>{idx++;if(idx>=19){clearInterval(timer);timer=null;document.getElementById('play').textContent='▶ 경로 재생';return}select(idx+1)},1800)};render();
</script></body></html>
